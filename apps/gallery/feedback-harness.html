    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cymatic · feedback harness</title>
    <style>
      html,
      body {
        margin: 0;

    <!--
      Minimal V2-04 feedback / trail verification harness. It drives the

      measure the luminous trail in real GPU pixels. The page exposes
      `window.__feedbackHarness` once ready.
    -->
    <div id="stage"><canvas id="c" width="256" height="256"></canvas></div>
    <script type="module" src="/src/feedback-harness.ts"></script>
  </body>
